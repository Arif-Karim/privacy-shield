<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <span id="dot" class="dot"></span>
      <span id="title">Privacy Shield</span>
    </div>
    <div id="domain" class="domain"></div>
    <div id="status" class="status">Checking this page…</div>
    <div id="note" class="note"></div>
    <ul id="reasons" class="reasons"></ul>
    <a id="policyLink" class="policy-link" target="_blank" rel="noopener noreferrer" hidden>Read their full privacy policy ↗</a>
    <div class="section">
      <div class="section-title">Privacy Shield Plus</div>
      <div id="alerts" class="alerts">Loading…</div>
    </div>
    <button id="reportBtn" class="report-btn">Report an issue with this site</button>
    <div id="reportStatus" class="report-status"></div>
    <script src="popup.js"></script>
  </body>
</html>
